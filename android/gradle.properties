org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m
org.gradle.workers.max=1
org.gradle.jvmargs=-Xmx1024m
org.gradle.workers.max=1
targetNDKArchs=armeabi-v7a,arm64-v8a
targetNDKArchs=armeabi-v7a,arm64-v8a
